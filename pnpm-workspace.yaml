packages:
  - apps/*
  - dev
  - packages/*
  - plugin
  - scripts
  - tools/architecture/ui
# Exempt from pnpm's minimum release age: @hvn-p's packages, which this
# repository's CI publishes (the architecture analyzer). A third-party version
# pinned before it is old enough goes here as name@version, and leaves once it
# is.
minimumReleaseAgeExclude:
  - "@hvn-p/*"
# Install scripts a dependency may run. esbuild's only checks its binary, which
# arrives through its platform package (@esbuild/<platform>); agent-browser's
# marks its bundled binary executable, which its launcher also does.
allowBuilds:
  agent-browser: false
  esbuild: false
