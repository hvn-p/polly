# The shared infrastructure of every worktree on the machine: one Postgres and
# one Garage, with the images and settings of the platform (vendors/infra).
# dev:up starts it; nothing stops it. Each worktree has its own role, databases,
# bucket and key in it.
#
# The project name is pinned: it would otherwise follow the directory, which is
# `main` in the bare layout. Tests run their own project, polly-dev-test, on
# other ports.

name: polly-dev

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      # Only read when the volume is first initialised. Administration goes
      # through `docker exec … psql`, so nobody needs this value afterwards.
      POSTGRES_PASSWORD: ${POLLY_DEV_POSTGRES_PASSWORD:?}
    ports:
      - 127.0.0.1:${POLLY_DEV_POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 5s
      retries: 30

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    command: [/garage, server, --single-node]
    environment:
      # Authenticates the node to itself and to its CLI only; the RPC port is
      # not published, so a fixed value exposes nothing.
      GARAGE_RPC_SECRET: 706f6c6c792d6465762d6f6e6c792d7270632d7365637265742d6e6f742d7573
    configs:
      - source: garage-toml
        target: /etc/garage.toml
    ports:
      - 127.0.0.1:${POLLY_DEV_GARAGE_PORT:-53900}:3900
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 2s
      timeout: 5s
      retries: 30

configs:
  garage-toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

volumes:
  postgres-data:
  garage-meta:
  garage-data:
