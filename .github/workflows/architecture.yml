# Publishes the architecture analyzer to npm on every change to it merged to
# main (a pull request that changes it builds it only): builds it for each platform, bumps the patch of the version last
# published, then publishes the platform packages and the launcher. npm trusts
# this workflow (trusted publishing), so no token is stored and provenance is
# added; NPM_TOKEN serves only the first publication, before npm can trust it.
name: Architecture release

on:
  push:
    branches: [main]
    paths: ["tools/architecture/**", ".github/workflows/architecture.yml"]
  pull_request:
    paths: ["tools/architecture/**", ".github/workflows/architecture.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two never take the same version.
concurrency:
  group: architecture-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - { key: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { key: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { key: darwin-x64, target: x86_64-apple-darwin, runner: macos-15 }
          - { key: darwin-arm64, target: aarch64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools/architecture/analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the toolchain; the target is added to it. musl
      # links the Linux binaries statically, so they run on any distribution.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.key }}
          path: tools/architecture/analyzer/target/${{ matrix.target }}/release/architecture-analyzer
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: binaries
      - name: Publish the next version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./tools/architecture/npm/launcher/package.json').name")
          published=$(npm view "$name" version 2>/dev/null || true)
          version=$(node --input-type=module -e "
            import { nextVersion } from './tools/architecture/npm/release.mjs'
            console.log(nextVersion(process.argv[1] || undefined))" "$published")
          for directory in $(node tools/architecture/npm/release.mjs "$version" binaries packages); do
            npm publish --access public "$directory"
          done
