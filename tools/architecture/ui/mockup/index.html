<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>architecture · hvn-p/polly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#121212; --raise:#181818; --panel:#1c1c1b; --line:#2a2928; --line-soft:#212120;
  --ink:#ecebe6; --ink-2:#bdbbb4; --mute:#8c8a84; --breach:#ff5a36; --breach-ground:#3a1a12;
  --ok-ground:#1a1a19; --cond:#262523; --added:#9bd3a0; --removed:#d79a8f;
  --sans:"Public Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums;overflow:hidden}
::selection{background:#ecebe633;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#3a3937 transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
code,.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--mute)}
svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

/* shell */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.top{display:flex;align-items:center;gap:20px;padding:0 20px;height:52px;border-bottom:1px solid var(--line);background:var(--ground)}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.repo{color:var(--mute)}
.branch{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink-2)}
.branch b{color:var(--ink);font-weight:500}
.live{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#7fb38a;box-shadow:0 0 0 3px #7fb38a22}
.tabs{display:flex;gap:2px;margin-left:12px;height:100%}
.tabs a{display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--mute);border-bottom:2px solid transparent;font-weight:500}
.tabs a:hover{color:var(--ink-2)}
.tabs a[aria-current]{color:var(--ink);border-bottom-color:var(--ink)}
.count{font-size:11px;border-radius:999px;padding:0 6px;background:var(--line);color:var(--ink-2)}
.count.breach{background:var(--breach);color:#1a0d08;font-weight:700}
.count.new{background:#ecebe6;color:#121212;font-weight:700}
.stats{margin-left:auto;color:var(--mute);font-size:13px}
.view{overflow:hidden;position:relative}
.synthetic{position:fixed;left:16px;bottom:12px;font-size:12px;color:var(--mute);background:var(--raise);border:1px solid var(--line);padding:4px 10px;border-radius:4px;z-index:5}

/* matrix page */
.mx{display:grid;grid-template-columns:1fr 380px;height:100%}
.chip{border:1px solid var(--line);border-radius:4px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.chip:hover{border-color:var(--mute);color:var(--ink)}
.grid{display:flex;flex-direction:column;overflow:hidden;padding:14px 0 0 18px;position:relative}
.scroller{flex:1;overflow:auto;position:relative;cursor:grab;user-select:none;overscroll-behavior:contain}
.scroller.panning{cursor:grabbing;user-select:none}
.zoom{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:4px}
.zoom button{padding:3px 8px;color:var(--ink-2)}
.zoom button:hover{color:var(--ink);background:var(--raise)}
.zoom output{min-width:44px;text-align:center;font-size:12px;color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 18px 14px 0;font-size:12px;color:var(--ink-2)}
.toolbar>*{white-space:nowrap}
.toolbar .hint{flex-basis:100%;color:var(--mute)}
.toolbar .bulk{display:flex;gap:6px;margin-left:auto}
.toolbar .k{display:flex;align-items:center;gap:6px}
.toolbar .k i{width:16px;height:16px;display:inline-block;border:1px solid #3a3937}
.wrap{position:relative;display:inline-block}
.band{position:absolute;left:0;top:0;pointer-events:none;background:#ecebe612;outline:1px solid #ecebe62e;outline-offset:-1px;opacity:0;z-index:3;will-change:transform}
table.m{border-collapse:separate;border-spacing:0}
.m{--z:1;
  /* labels never grow with the zoom: they fit the cell they name, and vanish below legibility */
  --zh:min(var(--z),1.25);--lab:calc(12px * var(--zh))}
.m.tiny .th-mod,.m.tiny .ch-mod{font-size:0}
.m.tiny .ch-mod{height:28px}
.m.tiny .agg-label{font-size:0}
.m th{font-weight:400;font-size:calc(12px * var(--zh));color:var(--ink-2);white-space:nowrap;padding:0}
.m th.hl{color:var(--ink)}
.m .th-tier{vertical-align:top;border-right:5px solid;text-align:left}
.m .th-tier button{display:flex;flex-direction:column;align-items:center;gap:4px;width:26px;padding:4px 0;color:var(--ink);font-weight:600;font-size:12px}
.m .th-tier button span{writing-mode:vertical-rl;transform:rotate(180deg);max-height:calc(var(--rows) * 25px * var(--z) - 26px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side h3,.pg h3{font-size:12px;font-weight:600;color:var(--mute);margin:18px 0 8px}
.m tr{height:calc(25px * var(--z))}
.m tr.h th{position:sticky;top:var(--t,0);z-index:4;background:var(--ground)}
.m .sl{position:sticky;left:var(--l,0);z-index:3;background:var(--ground)}
.m tr.h th.sl{z-index:6}
.m .ch-tier,.m .g-col{background:var(--ground)}
.m .th-mod{text-align:left;padding:0 10px 0 8px}
.m .th-mod a,.m .th-mod button{display:flex;align-items:center;gap:7px;height:24px}
.m .th-mod a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.stn{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;flex:none;background:var(--ground)}
.m .ch-tier{border-bottom:5px solid;text-align:left;vertical-align:bottom}
.m .ch-tier button{display:flex;align-items:center;gap:5px;padding:4px 4px 5px;font-weight:600;font-size:12px;color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden}
.m .ch-tier.one button span{display:none}
.m .ch-mod{height:calc(132px * var(--zh));vertical-align:bottom;width:calc(26px * var(--z));font-size:var(--lab);line-height:1}
.m .ch-mod span{max-height:calc(124px * var(--zh))}
.m .th-mod{font-size:var(--lab);max-width:calc(230px * var(--zh))}
.m .th-mod a,.m .th-mod button{height:auto;min-height:0;overflow:hidden;text-overflow:ellipsis;max-width:calc(230px * var(--zh))}
.m .th-mod .stn{width:min(10px,calc(25px * var(--z) - 6px));height:min(10px,calc(25px * var(--z) - 6px));border-width:min(2px,calc(var(--z) * 2px))}
.m .ch-mod a,.m .ch-mod button{display:block;width:calc(26px * var(--z));padding-bottom:6px}
.m .ch-mod span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;overflow:hidden;text-overflow:ellipsis}
.m .ch-mod a:hover span{color:var(--ink);text-decoration:underline}
.m td{width:calc(26px * var(--z));min-width:calc(26px * var(--z));height:calc(24px * var(--z));text-align:center;font:600 clamp(0px, calc(11px * var(--z)), 14px)/1 var(--mono);border-right:1px solid #ffffff0a;border-bottom:1px solid #ffffff0a;cursor:pointer;color:var(--ink)}
.m td.ok{background:#22301f}
.m td.same{background:#262624}
.m td.cond{background:#3b3319}
.m td.no{background:#2c1b18}
.m td.diag{background:var(--ground);cursor:default}
.m td.agg{font-weight:400}
.m td.breach{background:var(--breach);color:#1a0d08;font-weight:700}
.m td.sel{outline:2px solid var(--ink);outline-offset:-2px}
.m td.add{position:relative}
.m td.add::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--added);box-shadow:0 0 0 1px #121212}
.crumbs{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute);min-height:38px}
.crumbs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.crumbs .here{color:var(--ink)}
.crumbs .sep{opacity:.5}
.back{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:4px;padding:2px 9px;color:var(--ink-2);margin-right:6px}
.back:hover{border-color:var(--mute);color:var(--ink)}
.back[disabled]{opacity:.35;cursor:default}

.m .hd{cursor:pointer;user-select:none}
.m .hd:hover{background:#ecebe60d}
.m .g-col{border-bottom:3px solid #4a4946;text-align:left;font-weight:700;color:var(--ink);font-size:12px;padding:4px 6px;white-space:nowrap;vertical-align:bottom}
.m .g-row{border-right:3px solid #4a4946;vertical-align:top;width:22px}
.m .g-row div,.m .th-tier div{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:12px;color:var(--ink);padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(var(--rows) * 25px * var(--z) - 4px)}
.m .th-tier{vertical-align:top;border-right:5px solid;width:24px}
.m .th-tier div{font-weight:600;color:var(--ink-2)}
.m .ch-tier{border-bottom:5px solid;text-align:left;vertical-align:bottom;padding:3px 5px;font-weight:600;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;max-width:0}
.m .agg-label{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;color:var(--ink);padding-bottom:6px;max-height:124px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.m .th-mod.agg{font-weight:600;color:var(--ink)}
.m .th-mod.on,.m .ch-mod.on{color:var(--ink)}
.m .th-mod.on button{text-decoration:underline;text-underline-offset:3px}
.mod-list{margin-top:6px}
.mod-list button,.mod-list a{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;width:100%;text-align:left;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.mod-list button:hover{color:var(--ink)}
.open-page{display:inline-flex;gap:6px;align-items:center;margin-top:16px;border:1px solid var(--line);border-radius:4px;padding:4px 10px;color:var(--ink)}
.open-page:hover{border-color:var(--mute)}
/* relation, tier tags and status */
.node{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ground)}
.node .tt{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;font-weight:600;color:#121212;background:var(--c);white-space:nowrap}
.node .nm{padding:5px 10px;font:500 13px/1.4 var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.node:hover{border-color:var(--mute)}
.rel{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.arrow{display:flex;align-items:center;gap:8px;padding:4px 0 4px 18px;color:var(--ink-2);font-size:12px}
.arrow svg{width:14px;height:30px;stroke:var(--ink-2);stroke-width:1.75;fill:none}
.arrow.breach svg{stroke:var(--breach)} .arrow.breach{color:var(--breach)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:3px;padding:2px 8px;margin-top:14px}
.status.breach{background:var(--breach);color:#1a0d08}
.status.ok{background:#22301f;color:#a9cf9e}
.status.cond{background:#3b3319;color:#e2cf90}
.status.no{background:#2c1b18;color:#e3a597}
.reason{color:var(--ink-2);margin-top:8px;font-size:13px}
.lst{margin-top:6px}
.lst button{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;width:100%;text-align:left;padding:6px 0;border-bottom:1px solid var(--line)}
.lst button:hover .nm2{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.lst .tt2{font-size:11px;font-weight:600;color:#121212;background:var(--c);border-radius:3px;padding:1px 6px;white-space:nowrap}
.lst .nm2{font:12.5px var(--mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst .st{font-size:11px;font-weight:600;border-radius:3px;padding:1px 6px}
.lst .st.breach{background:var(--breach);color:#1a0d08}.lst .st.cond{background:#3b3319;color:#e2cf90}.lst .st.no{background:#2c1b18;color:#e3a597}
details.link summary{grid-template-columns:16px 1fr auto auto auto !important}
details.link[open] summary .chev{transform:none}
details.link:not([open]) summary .chev{transform:rotate(-90deg)}
.to .tt2{font-size:11px;font-weight:600;color:#121212;background:var(--c);border-radius:3px;padding:1px 6px;white-space:nowrap}
.openmod{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:1px 8px}
.openmod:hover{color:var(--ink);border-color:var(--mute)}
/* rules page */
.rl{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start;margin-top:18px}
.tm{border-collapse:separate;border-spacing:0}
.tm th{font-weight:400;font-size:12px;color:var(--ink-2);white-space:nowrap;padding:0}
.tm th.r{text-align:left;padding-right:8px;cursor:pointer}
.tm th.r span{display:flex;align-items:center;gap:6px;height:20px}
.tm th.r:hover,.tm th.r.on{color:var(--ink)}
.tm th.r.on span{font-weight:600}
.tm th.c{height:130px;vertical-align:bottom;width:20px}
.tm th.c span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;padding-bottom:4px}
.tm th.c i{display:block;height:5px}
.tm th.r i{width:5px;height:16px;border-radius:2px;display:block}
.tm td{width:20px;height:20px;border-right:1px solid #ffffff0a;border-bottom:1px solid #ffffff0a;cursor:pointer}
.tm td.ok{background:#22301f}.tm td.cond{background:#3b3319}.tm td.no{background:#2c1b18}.tm td.same{background:#262624}
.tm tr.on td{box-shadow:inset 0 1px 0 #ecebe655,inset 0 -1px 0 #ecebe655}
.tm .gl td{height:6px;border:0;cursor:default}
.tdet{position:sticky;top:0;max-width:640px}
.tdet .name{display:flex;align-items:center;gap:10px}
.tdet .name i{width:28px;height:6px;border-radius:3px;display:block}
.tdet h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tdet h4{font-size:12px;font-weight:600;color:var(--mute);margin:20px 0 6px}
.tdet p.big{font-size:15px;color:var(--ink);max-width:62ch}
.tdet ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.tdet li{display:flex;align-items:center;gap:8px}
.tdet li .cond{color:#e2cf90;font-size:12px}
.tdet .paths code{display:block;color:var(--ink-2)}
.grid{position:relative}
.mini{position:absolute;right:30px;bottom:22px;z-index:8;background:#121212e6;border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px #0009;cursor:pointer}
.tgroup>div:first-child{display:none}
.tgroup{margin-top:0}
/* side panel */
.side{border-left:1px solid var(--line);overflow:auto;padding:18px 20px 60px;background:var(--raise)}
.pair{font-size:13px;color:var(--mute)}
.pair b{color:var(--ink);font-weight:500}
.verdict{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:12px 0 6px}
.verdict.breach{color:var(--breach)} .verdict.no{color:#d79a8f} .verdict.ok{color:var(--ink)} .verdict.cond{color:#d6c48a}
.why{color:var(--ink-2);max-width:62ch}
.imports{margin-top:14px;border-top:1px solid var(--line)}
.imp{display:block;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.imp:hover .file{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.imp .file{color:var(--ink-2)}
.imp .names{display:block;color:var(--mute);margin-top:2px}
.empty{color:var(--mute);margin-top:12px}

/* pages */
.pg{height:100%;overflow:auto;padding:24px 32px 80px}
.pg h1{font-size:22px;letter-spacing:-.015em;font-weight:700}
.pg .sub{color:var(--mute);margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:22px}
.lane h2{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.tgroup{margin-top:14px}
.tgroup>div:first-child{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:4px}
.tgroup .ln{display:block;width:22px;height:5px;border-radius:3px}
details.link{border-bottom:1px solid var(--line)}
details.link summary{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;cursor:pointer;list-style:none}
details.link summary::-webkit-details-marker{display:none}
details.link summary:hover .to{color:var(--ink)}
.to{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.tag{font-size:11px;font-weight:600;border-radius:3px;padding:1px 6px;background:var(--line);color:var(--ink-2)}
.tag.breach{background:var(--breach);color:#1a0d08} .tag.cond{background:#3a3524;color:#e2cf90}
details.link .imp{padding-left:18px}
.facts{display:flex;gap:24px;margin-top:14px;color:var(--ink-2);font-size:13px}
.facts b{color:var(--ink);font-weight:500}
.hero{display:flex;align-items:center;gap:12px}
.hero .stn{width:16px;height:16px;border-width:3px}
.rows .r{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.rows .r:hover{background:linear-gradient(90deg,transparent,var(--raise) 20%,var(--raise) 80%,transparent)}
.when{color:var(--mute);font-size:13px}
.ch{display:flex;flex-direction:column;gap:3px}
.plus{color:var(--added)} .minus{color:var(--removed)}
.unseen{position:relative}
.unseen::before{content:"";position:absolute;left:-14px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.rules{width:100%;border-collapse:collapse;margin-top:8px}
.rules th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:8px 16px 8px 0;border-bottom:1px solid var(--line);position:sticky;top:-24px;background:var(--ground)}
.rules td{vertical-align:top;padding:14px 16px 14px 0;border-bottom:1px solid var(--line);color:var(--ink-2);max-width:56ch}
.rules td.name{white-space:nowrap;color:var(--ink);font-weight:600}
.rules td.name span{display:flex;gap:10px;align-items:center}
.rules .ln{display:block;width:28px;height:6px;border-radius:3px;flex:none}
.rules .gh td{padding-top:26px;color:var(--mute);font-size:12px;font-weight:600;border-bottom:0}
.allow{display:flex;flex-direction:column;gap:5px}
.allow a{display:flex;align-items:center;gap:8px;color:var(--ink)}
.allow a:hover{text-decoration:underline;text-underline-offset:3px}
.allow small{color:#d6c48a;font-size:11px}
.allow .none{color:var(--mute)}

/* source panel */
.src{position:fixed;top:91px;right:0;bottom:0;width:min(820px,62vw);background:#0e0e0e;border-left:1px solid var(--line);box-shadow:-24px 0 48px #00000080;transform:translateX(100%);transition:transform .28s cubic-bezier(.16,1,.3,1);display:grid;grid-template-rows:auto 1fr;z-index:10}
.src.open{transform:none}
.src header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.src header .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src pre{overflow:auto;padding:10px 0 60px;font:12.5px/20px var(--mono);counter-reset:l}
.src .l{display:grid;grid-template-columns:52px 1fr;padding-right:20px}
.src .l>span:first-child{color:#5a5955;text-align:right;padding-right:16px;user-select:none}
.src .l.imp-line{background:linear-gradient(90deg,var(--tc) 0 3px,color-mix(in srgb,var(--tc) 12%,transparent) 3px)}
.src .l.breach-line{background:linear-gradient(90deg,var(--breach) 0 3px,#ff5a3622 3px)}
.src .l.target{outline:1px solid #ecebe655;outline-offset:-1px}
.src .note{white-space:normal;grid-column:2;margin:4px 20px 8px 0;padding:8px 10px;border-radius:4px;background:#2a130d;color:#ffc2b3;font:13px/1.45 var(--sans);max-width:70ch}
.src .note b{color:var(--breach)}
.src .go{white-space:normal;grid-column:2;margin:-2px 0 6px;font:12px var(--sans);color:var(--ink-2)}
.src .go a{text-decoration:underline;text-underline-offset:3px}
.k{color:#c6a6d8}.s{color:#b9c98f}.c{color:#6f6d68;font-style:italic}
.close{border:1px solid var(--line);border-radius:4px;padding:4px 10px}

const SOURCES = {"packages/back/src/flows/start-lesson/index.ts": "// Connects a lesson's event stream to the learner: binds the code the agent's\n// event listener drew.\n\nimport { bind, type EventCodeStore } from '../../domains/event-codes/index.ts'\nimport { PostgresStore } from '@polly/database'\n\nexport async function startLesson(\n  { codes }: { codes: EventCodeStore },\n  learnerId: string,\n  code: string,\n): Promise<{ bound: true }> {\n  await bind(codes, learnerId, code)\n  return { bound: true }\n}", "apps/worker/src/main.ts": "// The worker's composition root: runs the analyses the API enqueues, as DBOS\n// workflows on the worktree's database, with the analyzer its mode names: the\n// fake one by default, the compute service's in real mode. A workflow\n// interrupted by the worker's death resumes when a worker starts again.\n\nimport { DBOS } from '@dbos-inc/dbos-sdk'\nimport { computeAnalyzer, computeFingerprint, fakeAnalyzer } from '@polly/analysis'\nimport { type Analyzer, runPlaceholderAnalysis } from '@polly/back'\nimport { createLogger } from '@polly/logging'\nimport { type Logger, readConfigOf } from '@polly/platform'\nimport { PLACEHOLDER_ANALYSIS } from '@polly/queue'\n\nexport interface WorkerOptions {\n  databaseUrl: string\n  analyzer: Analyzer\n  log: Logger\n}\n\nexport async function startWorker({\n  databaseUrl,\n  analyzer,\n  log,\n}: WorkerOptions): Promise<{ close: () => Promise<void> }> {\n  const entry = (level: 'debug' | 'info' | 'warn' | 'error') => (value: unknown) =>\n    typeof value === 'string' ? log[level](value) : log[level]('dbos', { value })\n  DBOS.setConfig({\n    name: 'polly',\n    systemDatabaseUrl: databaseUrl,\n    applicationVersion: PLACEHOLDER_ANALYSIS.applicationVersion,\n    logger: { debug: entry('debug'), info: entry('info'), warn: entry('warn'), error: entry('error') },\n  })\n  DBOS.registerWorkflow((recordingId: string) => runPlaceholderAnalysis({ analyzer }, recordingId), {\n    name: PLACEHOLDER_ANALYSIS.workflowName,\n  })\n  await DBOS.launch()\n  // A queue persists its configuration in the system database: after launch.\n  await DBOS.registerQueue(PLACEHOLDER_ANALYSIS.queueName)\n  log.info('worker ready', { queue: PLACEHOLDER_ANALYSIS.queueName })\n  return { close: () => DBOS.shutdown() }\n}\n\n// The analyzer of the worktree's POLLY_WORKER_MODE, or the setting that\n// prevents it.\nexport function analyzerFor(\n  env: Record<string, string | undefined>,\n): { analyzer: Analyzer } | { invalid: string } {\n  const mode = env['POLLY_WORKER_MODE'] ?? 'fake'\n  if (mode === 'fake') {\n    return { analyzer: fakeAnalyzer }\n  }\n  if (mode !== 'real') {\n    return { invalid: 'POLLY_WORKER_MODE' }\n  }\n  const computeUrl = env['POLLY_COMPUTE_URL'] ?? ''\n  return URL.canParse(computeUrl)\n    ? { analyzer: computeAnalyzer({ baseUrl: computeUrl }) }\n    : { invalid: 'POLLY_COMPUTE_URL' }\n}\n\n// Warns when the compute service runs another version of the code than the\n// worktree's services/compute: comparing two versions is legitimate, testing\n// one without knowing is not.\nexport async function checkComputeVersion(\n  env: Record<string, string | undefined>,\n  log: Logger,\n): Promise<void> {\n  const baseUrl = env['POLLY_COMPUTE_URL'] ?? ''\n  const worktree = env['POLLY_COMPUTE_FINGERPRINT'] ?? 'unversioned'\n  try {\n    const service = await computeFingerprint({ baseUrl })\n    if (service !== worktree) {\n      log.warn('COMPUTE_VERSION_MISMATCH', { worktree, service })\n    }\n  } catch (error) {\n    log.warn('the compute service did not report its version', { url: baseUrl, error })\n  }\n}\n\nif (process.argv[1] === import.meta.filename) {\n  const log = createLogger({ name: 'polly-worker' })\n  const chosen = analyzerFor(process.env)\n  if ('invalid' in chosen) {\n    log.error('INVALID_CONFIGURATION', { keys: [chosen.invalid] })\n    process.exit(1)\n  }\n  try {\n    const config = readConfigOf(process.env, ['DATABASE_URL'])\n    if (proces     <div class="facts"><span>Tier <b>${esc(tierById[m.tier].name)}</b></span><span>Package <b>${esc(m.package)}</b></span><span><b>${m.files.length}</b> file${m.files.length===1?'':'s'}</span><span>Technologies <b>${techs.map(esc).join(', ')||'none'}</b></span></div>
    <div class="cols">${lane('Imports',edges.filter(e=>e.from===id),'to')}${lane('Imported by',edges.filter(e=>e.to===id),'from')}</div>
    <h3>Files</h3>${m.files.map(f=>`<button class="imp" data-src="${esc(f)}" data-line="1"><span class="file mono">${esc(f)}</span></button>`).join('')}</div>`;
}

function breachesPage(){
  const by={}; violations.forEach(v=>(by[v.rule]=by[v.rule]||[]).push(v));
  return `<div class="pg"><h1>Breaches</h1><p class="sub">Every import the rules refuse, grouped by rule. Open one to read it in its source.</p>
  ${Object.entries(by).map(([rule,vs])=>`<h3>${esc(rule)} · ${vs.length}</h3><div class="rows">${vs.map(v=>`<div class="r"><span class="tag breach" style="justify-self:start">${esc(rule)}</span><div><button class="imp" data-src="${esc(v.file)}" data-line="${v.line}" style="padding:0;border:0"><span class="file mono">${esc(v.file)}:${v.line}</span></button><p>${esc(v.message)}</p><p class="mute">${esc(v.fix)}</p></div></div>`).join('')}</div>`).join('')||'<p class="empty">No breach: the repository follows its rules.</p>'}</div>`;
}

function changesPage(){
  const base=SAMPLE.base;
  return `<div class="pg"><h1>Changes</h1><p class="sub">What this branch changes against main, and what changed since this session started.</p>
  <div class="cols"><section class="lane"><h2>Against main <span class="count">+${base.added.length} −${base.removed.length}</span></h2><div class="rows">
    ${base.added.map(p=>`<div class="r"><span class="plus">added</span><a class="plus mono" href="#/module/${encodeURIComponent(p[0])}">${esc(short(p[0]))} → ${esc(short(p[1]))}</a></div>`).join('')}
    ${base.removed.map(p=>`<div class="r"><span class="minus">removed</span><span class="minus mono">${esc(short(p[0]))} → ${esc(short(p[1]))}</span></div>`).join('')}
    <div class="r"><span class="tag breach" style="justify-self:start">+1 breach</span><span>tier, ${esc(SAMPLE.violations[0].file)}:${SAMPLE.violations[0].line}</span></div></div></section>
  <section class="lane"><h2>This session <span class="count new">${SAMPLE.history.filter(h=>h.unseen).length} new</span> <button class="chip" style="margin-left:auto">Mark all as seen</button></h2><div class="rows">
    ${SAMPLE.history.map(h=>`<div class="r ${h.unseen?'unseen':''}"><span class="when">${h.at}</span><div class="ch"><button class="imp" data-src="${esc(h.file)}" data-line="1" style="padding:0;border:0"><span class="file mono">${esc(h.file)}</span></button>${h.changes.map(c=>`<span class="${c[0]==='+'?'plus':'minus'} mono">${c[0]==='+'?'+':'−'} ${esc(c.slice(1))}</span>`).join('')}${h.breach?`<span class="tag breach" style="align-self:start">breach: ${esc(h.breach)}</span>`:''}</div></div>`).join('')}
  </div></section></div></div>`;
}

let ruleTier=tiers[0].id;
function rulesPage(){
  const ts=tiers, t=tierById[ruleTier];
  const head=ts.map(c=>`<th class="c"><span>${esc(c.name)}</span><i style="background:${colour[c.id]}"></i></th>`).join('');
  const rows=groups.map(g=>`<tr class="gl"><td colspan="${ts.length+1}"></td></tr>`+ts.filter(r=>r.group===g).map(r=>`<tr class="${r.id===ruleTier?'on':''}"><th class="r${r.id===ruleTier?' on':''}" data-rule="${r.id}"><span><i style="background:${colour[r.id]}"></i>${esc(r.name)}</span></th>${ts.map(c=>`<td class="${r.id===c.id?'same':ruleOf(r.id,c.id).kind}" data-rule="${r.id}" title="${esc(r.name)} → ${esc(c.name)}: ${{ok:'allowed',cond:'allowed on a condition',no:'forbidden',same:'same tier'}[r.id===c.id?'same':ruleOf(r.id,c.id).kind]}"></td>`).join('')}</tr>`).join('')).join('');
  const may=(t.mayImport||[]).map(x=>{const id=typeof x==='string'?x:x.tier, cond=typeof x==='string'?'':[x.typesOnly&&'its types only',x.onlyFrom?.length&&`only from ${x.onlyFrom.join(', ')}`].filter(Boolean).join('; ');
    return `<li><i class="ln" style="background:${colour[id]};width:16px;height:5px;border-radius:3px;display:block"></i>${esc(tierById[id]?.name||id)}${cond?`<span class="cond">${esc(cond)}</span>`:''}</li>`}).join('')||'<li class="mute">Nothing: this tier imports no other tier.</li>';
  const ms=modules.filter(m=>m.tier===t.id);
  return `<div class="pg"><h1>Rules</h1><p class="sub">Who may import whom, from <span class="mono">architecture.rules.json</span>. Rows import columns; click a tier to read its rule.</p>
  <div class="key" style="display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--ink-2)"><span class="k" style="display:flex;gap:6px;align-items:center"><i style="width:14px;height:14px;background:#22301f;display:inline-block"></i>allowed</span><span class="k" style="display:flex;gap:6px;align-items:center"><i style="width:14px;height:14px;background:#3b3319;display:inline-block"></i>on a condition</span><span class="k" style="display:flex;gap:6px;align-items:center"><i style="width:14px;height:14px;background:#2c1b18;display:inline-block"></i>forbidden</span></div>
  <div class="rl"><table class="tm"><tr><th></th>${head}</tr>${rows}</table>
  <section class="tdet"><div class="name"><i style="background:${colour[t.id]}"></i><h2>${esc(t.name)}</h2><span class="mute">${esc(t.group)} group</span></div>
    <h4>What belongs here</h4><p class="big">${esc(t.criterion)}</p>
    <h4>May import</h4><ul>${may}</ul>
    ${t.isolated?`<h4>Within the tier</h4><p>${esc(t.isolated)}</p>`:''}
    <h4>Technologies it may use</h4><p>${t.technologies?(t.technologies.length?t.technologies.map(x=>`<code>${esc(x)}</code>`).join(', '):'None.'):'Any.'}</p>
    <h4>Paths, and the modules they make</h4><div class="paths">${t.paths.map(x=>`<code>${esc(x)}</code>`).join('')}</div><p class="mute" style="margin-top:6px">${ms.length} module${ms.length===1?'':'s'}: ${ms.map(m=>`<a href="#/module/${encodeURIComponent(m.id)}" style="text-decoration:underline;text-underline-offset:3px">${esc(short(m.id))}</a>`).join(', ')||'none yet'}</p>
    <h4>When it is breached</h4><p>${esc(t.fix||'')}</p>
  </section></div></div>`;
}

// source panel
function highlight(line){
  return esc(line).replace(/(\/\/.*$)/,'<span class="c">$1</span>').replace(/('[^']*')/g,'<span class="s">$1</span>').replace(/\b(import|export|from|const|let|async|await|function|return|type|interface|if|else|new|throw)\b/g,'<span class="k">$1</span>');
}
function openSource(file,line){
  const src=document.getElementById('src'), text=SOURCES[file];
  const fileEdges=edges.filter(e=>e.file===file), fileBreach=violations.filter(v=>v.file===file);
  const body=text===undefined?`<p class="empty" style="padding:16px">In the mockup, the source is embedded for a few files only; the app reads any analyzed file from the analyzer.</p>`:
    `<pre>${text.split('\n').map((l,i)=>{
      const n=i+1, es=fileEdges.filter(e=>e.line===n), br=fileBreach.find(v=>v.line===n);
      const tc=es[0]?colour[modById[es[0].to].tier]:'';
      const cls=['l',br?'breach-line':es.length?'imp-line':'',n===line?'target':''].join(' ');
      return `<div class="${cls}" id="L${n}" style="${tc?`--tc:${tc}`:''}"><span>${n}</span><span>${highlight(l)||' '}</span>${es.length&&!br?`<span class="go">imports <a href="#/module/${encodeURIComponent(es[0].to)}">${esc(short(es[0].to))}</a>, ${esc(tierById[modById[es[0].to].tier].name)}</span>`:''}${br?`<div class="note"><b>Breach, ${esc(br.rule)}.</b> ${esc(br.message)}<br>${esc(br.fix)}</div>`:''}</div>`;
    }).join('')}</pre>`;
  src.innerHTML=`<header><span class="path mono">${esc(file)}</span><span class="mute">${fileEdges.length} import${fileEdges.length===1?'':'s'}${fileBreach.length?`, <span style="color:var(--breach)">${fileBreach.length} breach</span>`:''}</span><button class="close" data-close>${icon.x} Close</button></header>${body}`;
  src.classList.add('open');
  requestAnimationFrame(()=>document.getElementById('L'+line)?.scrollIntoView({block:'center'}));
}

// routing, the trail of views visited, and events
const trail=[];
function labelOf(hash){
  const [,page='matrix',arg]=hash.split('/');
  return page==='module'?short(decodeURIComponent(arg)):{matrix:'Matrix',breaches:'Breaches',changes:'Changes',rules:'Rules'}[page]||'Matrix';
}
function track(){
  const h=location.hash||'#/matrix', [,page]=h.split('/');
  if(page!=='module'){trail.length=0;trail.push(h);return}
  const at=trail.indexOf(h);
  if(at>=0) trail.length=at+1; else trail.push(h);
}
function render(){
  track();
  const [,page='matrix',arg]=location.hash.split('/');
  const tabs=[['matrix','Matrix'],['breaches','Breaches',`<span class="count breach">${violations.length}</span>`],['changes','Changes',`<span class="count new">${SAMPLE.history.filter(h=>h.unseen).length}</span>`],['rules','Rules']];
  const tab=page==='module'?(trail[0]||'#/matrix').split('/')[1]:page;
  document.getElementById('tabs').innerHTML=tabs.map(([id,l,c=''])=>`<a href="#/${id}"${tab===id?' aria-current="page"':''}>${l}${c}</a>`).join('');
  document.getElementById('stats').textContent=`${modules.length} modules · ${edges.length} imports · ${tiers.length} tiers`;
  const shown=trail.length>6?[trail[0],null,...trail.slice(-4)]:trail;
  document.getElementById('crumbs').innerHTML=`<button class="back" data-back ${trail.length<2?'disabled':''}><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</button>`+
    shown.map((h,k)=>h===null?'<span class="sep">…</span>':k===shown.length-1?`<span class="here">${esc(labelOf(h))}</span>`:`<a href="${h}">${esc(labelOf(h))}</a><span class="sep">›</span>`).join('');
  document.getElementById('view').innerHTML=page==='module'?modulePage(decodeURIComponent(arg)):page==='breaches'?breachesPage():page==='changes'?changesPage():page==='rules'?rulesPage():matrixPage();
  heads(); sticky(); minimap();
}
function sticky(){
  const m=document.getElementById('m'); if(!m) return;
  const hs=[...m.querySelectorAll('tr.h')]; let t=0; hs.forEach(r=>{r.querySelectorAll('th').forEach(th=>th.style.setProperty('--t',t+'px')); t+=r.offsetHeight});
  const first=hs[2]; if(!first) return; let l=0; ['c0','c1','c2'].forEach(c=>{const w=first.querySelector('.'+c)?.offsetWidth||0; m.querySelectorAll('.'+c).forEach(th=>th.style.setProperty('--l',l+'px')); l+=w});
}
// the crosshair: two bands follow the hovered cell, nothing else is touched
let rowHeads=[],colHeads=[],hovered=null,bandW=0,bandH=0;
function heads(){
  const m=document.getElementById('m'); if(!m) return;
  rowHeads=[...m.querySelectorAll('th.th-mod')]; colHeads=[...m.querySelectorAll('th.ch-mod')];
  const w=document.getElementById('m'); bandW=w.offsetWidth; bandH=w.offsetHeight;
}
document.addEventListener('pointerover',ev=>{
  const td=ev.target.closest('.m td[data-i]'), R=document.getElementById('bandR'), C=document.getElementById('bandC'); if(!R) return;
  if(td===hovered) return;
  if(hovered){rowHeads[hovered.dataset.i]?.classList.remove('hl');colHeads[hovered.dataset.j]?.classList.remove('hl')}
  hovered=td;
  if(!td){R.style.opacity=C.style.opacity=0;return}
  R.style.width=bandW+'px'; R.style.height=td.offsetHeight+'px'; R.style.transform=`translateY(${td.offsetTop}px)`; R.style.opacity=1;
  C.style.height=bandH+'px'; C.style.width=td.offsetWidth+'px'; C.style.transform=`translateX(${td.offsetLeft}px)`; C.style.opacity=1;
  rowHeads[td.dataset.i]?.classList.add('hl');colHeads[td.dataset.j]?.classList.add('hl');
});
document.addEventListener('click',ev=>{
  const z=ev.target.closest('[data-zoom]'); if(z){ return z.dataset.zoom==='fit'?fit():setZoom(zoom*(z.dataset.zoom==='1'?1.2:1/1.2)) }
  const rt=ev.target.closest('[data-rule]'); if(rt){ruleTier=rt.dataset.rule;return render()}
  const t=ev.target.closest('[data-back],[data-mod],[data-pair],[data-group],[data-tier],[data-all],td[data-i],[data-src],[data-close]'); if(!t) return;
  if(t.dataset.mod){selected={kind:'module',id:t.dataset.mod};return render()}
  if(t.dataset.pair){const [f,to]=t.dataset.pair.split('|');selected={kind:'pair',from:f,to};return render()}
  if(t.dataset.group){collapsedGroups.has(t.dataset.group)?collapsedGroups.delete(t.dataset.group):collapsedGroups.add(t.dataset.group);return render()}
  if(t.dataset.back!==undefined) return history.back();
  if(t.dataset.close!==undefined) return document.getElementById('src').classList.remove('open');
  if(t.dataset.src) return openSource(t.dataset.src,+t.dataset.line);
  if(t.dataset.all){const open=t.dataset.all==='open';tiers.forEach(x=>open?collapsed.delete(x.id):collapsed.add(x.id));groups.forEach(g=>open?collapsedGroups.delete(g):collapsedGroups.add(g));return render()}
  if(t.dataset.tier){collapsed.has(t.dataset.tier)?collapsed.delete(t.dataset.tier):collapsed.add(t.dataset.tier);return render()}
  if(t.dataset.i!==undefined&&t.dataset.j!==undefined){
    const ax=flat(axisTree()), r=ax[+t.dataset.i], c=ax[+t.dataset.j];
    for(const x of [r,c]){ if(x.agg==='group') collapsedGroups.delete(x.group); else if(x.agg) collapsed.delete(x.tier) }
    if(r.agg||c.agg) return render();
    selected={kind:'pair',from:r.id,to:c.id}; render();
  }
});
// the overview: every cell as a pixel block, the visible part framed; click or drag to move
let miniBase=null;
function minimap(){
  const c=document.getElementById('mini'), m=document.getElementById('m'); if(!c) return;
  const tds=[...m.querySelectorAll('tr:not(.h)')].map(r=>[...r.querySelectorAll('td')]), n=tds.length; if(!n) return;
  const px=Math.max(2,Math.floor(150/n)), W=n*px; c.width=c.height=W+8;
  const g=c.getContext('2d'), col={ok:'#3d5a37',cond:'#6b5d2c',no:'#4a2a24',same:'#3a3a37',breach:'#ff5a36',diag:'#121212'};
  tds.forEach((row,i)=>row.forEach((td,j)=>{g.fillStyle=col[td.classList[0]]||'#222';g.fillRect(4+j*px,4+i*px,px,px)}));
  miniBase=g.getImageData(0,0,c.width,c.height); frame();
  const sc=document.getElementById('scroller');
  sc.onscroll=()=>requestAnimationFrame(frame);
  const go=e=>{const b=c.getBoundingClientRect(), f=fit2();sc.scrollLeft=(e.clientX-b.left-4)/f.x-sc.clientWidth/2;sc.scrollTop=(e.clientY-b.top-4)/f.y-sc.clientHeight/2};
  c.onpointerdown=e=>{e.stopPropagation();c.setPointerCapture(e.pointerId);go(e);c.onpointermove=go};
  c.onpointerup=e=>{c.onpointermove=null};
}
function fit2(){const c=document.getElementById('mini'),m=document.getElementById('m');const W=c.width-8;return {x:W/m.scrollWidth,y:W/m.scrollHeight}}
function frame(){
  const c=document.getElementById('mini'), sc=document.getElementById('scroller'); if(!c||!miniBase) return;
  const g=c.getContext('2d'); g.putImageData(miniBase,0,0); const f=fit2(), W=c.width-8;
  g.strokeStyle='#ecebe6';g.lineWidth=1.5;
  g.strokeRect(4+sc.scrollLeft*f.x,4+sc.scrollTop*f.y,Math.min(W,sc.clientWidth*f.x),Math.min(W,sc.clientHeight*f.y));
}
function setZoom(z,cx,cy){
  const sc=document.getElementById('scroller'), m=document.getElementById('m'); if(!sc) return;
  z=Math.min(3,Math.max(1,z)); const r=z/zoom;
  const px=(cx??sc.clientWidth/2)+sc.scrollLeft, py=(cy??sc.clientHeight/2)+sc.scrollTop;
  zoom=z; m.style.setProperty('--z',z); m.classList.toggle('tiny',z*25-9<8); document.getElementById('zv').value=Math.round(z*100)+'%';
  sc.scrollLeft=px*r-(cx??sc.clientWidth/2); sc.scrollTop=py*r-(cy??sc.clientHeight/2);
  heads(); sticky(); minimap();
}
function fit(){
  const sc=document.getElementById('scroller'), m=document.getElementById('m'); if(!sc) return;
  setZoom(zoom*Math.min(sc.clientWidth/m.offsetWidth,sc.clientHeight/m.offsetHeight)*.98);
}
// The wheel scrolls (Shift for sideways, two fingers on a touchpad in every direction);
// Ctrl or Cmd with the wheel, or a pinch, zooms around the pointer.
document.addEventListener('wheel',ev=>{
  const sc=ev.target.closest('#scroller'); if(!sc||!(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault(); const b=sc.getBoundingClientRect();
  setZoom(zoom*Math.exp(-ev.deltaY*(Math.abs(ev.deltaY)<20?.01:.0025)),ev.clientX-b.left,ev.clientY-b.top);
},{passive:false});
let pan=null, suppress=false;
document.addEventListener('pointerdown',ev=>{
  const sc=ev.target.closest('#scroller'); if(!sc||ev.button!==0) return;
  pan={sc,id:ev.pointerId,x:ev.clientX,y:ev.clientY,l:sc.scrollLeft,t:sc.scrollTop,moved:false};
});
document.addEventListener('pointermove',ev=>{
  if(!pan||ev.pointerId!==pan.id) return; const dx=ev.clientX-pan.x, dy=ev.clientY-pan.y;
  if(!pan.moved){ if(Math.hypot(dx,dy)<5) return; pan.moved=true; pan.sc.setPointerCapture(pan.id); pan.sc.classList.add('panning') }
  pan.sc.scrollLeft=pan.l-dx; pan.sc.scrollTop=pan.t-dy;
});
const endPan=()=>{ if(pan?.moved){suppress=true; pan.sc.classList.remove('panning'); setTimeout(()=>suppress=false,0)} pan=null };
document.addEventListener('pointerup',endPan); document.addEventListener('pointercancel',endPan);
document.addEventListener('click',ev=>{ if(suppress){suppress=false; ev.stopPropagation(); ev.preventDefault()} },true);
document.addEventListener('keydown',ev=>{
  if(!document.getElementById('scroller')||ev.target.closest('input,textarea')) return;
  if(ev.key==='+'||ev.key==='=') setZoom(zoom*1.2); else if(ev.key==='-') setZoom(zoom/1.2); else if(ev.key==='0') fit();
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') document.getElementById('src').classList.remove('open') });
addEventListener('hashchange',()=>{document.getElementById('src').classList.remove('open');render()}); render();
</script>
