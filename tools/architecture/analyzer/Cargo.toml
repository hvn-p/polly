[package]
name = "architecture-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Checks a TypeScript repository's imports against its architecture rules, and serves them live"
license = "MIT"
publish = false

[[bin]]
name = "architecture-analyzer"
path = "src/main.rs"

[dependencies]
oxc_allocator = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_resolver = "=11.24.3"
oxc_span = "=0.156.0"
oxc_syntax = "=0.156.0"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tiny_http = "=0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "=0.11.5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify = "=8.2.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
